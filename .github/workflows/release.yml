name: Release macOS App

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # 1. 安装构建依赖
      # Makefile 中的 'bundle' 任务依赖 cargo-bundle
      # Makefile 中的 'dmg' 任务依赖 create-dmg
      - name: Install Build Tools
        run: |
          cargo install cargo-bundle
          brew install create-dmg

      # 2. 直接调用 Makefile
      # 这会自动触发 bundle -> dmg 流程
      - name: Build DMG via Makefile
        run: make dmg

      # 3. 重命名并准备上传
      # Makefile 生成的文件名是固定的 "Hedwig_Installer.dmg" 
      # 我们通常希望发布的文件名带上版本号，例如 "Hedwig-v0.1.0-macos.dmg"
      - name: Prepare Release Asset
        run: |
          # 定义原始路径 (参考 Makefile 中的 TARGET_DIR 和 DMG_NAME)
          ORIGINAL_DMG="target/release/bundle/osx/Hedwig_Installer.dmg"
          
          # 定义新文件名 (使用 git tag)
          NEW_NAME="Hedwig-${{ github.ref_name }}-macos.dmg"
          
          mv "$ORIGINAL_DMG" "$NEW_NAME"
          
          # 将新文件名写入环境变量，供下一步使用
          echo "ASSET_PATH=$NEW_NAME" >> $GITHUB_ENV

      # 4. 上传到 GitHub Release
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ASSET_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
