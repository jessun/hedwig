[package]
name = "hedwig"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
dirs = "6.0.0"
http = "1.4.0"
notify = "8.2.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "http2"] }
roxmltree = "0.21.1"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.49.0", features = ["full"] }
toml = "0.9.11"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time", "local-time"] }
